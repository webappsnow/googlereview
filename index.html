<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Review Card - Mengalihkan...</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h3 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h3>Membuka Halaman Ulasan...</h3>
        <p id="statusText">Mohon tunggu sebentar, Anda sedang diarahkan ke ulasan toko.</p>
    </div>

    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda (berakhiran /exec)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynchA-hJl-MAWgrYnzNEUvDsrkJfohWPwILtVVMWn7BrJuUOdbpOOzLOs21zAQxm90zw/exec";

        // Ambil parameter ?card=... dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('card');

        if (!cardId) {
            document.getElementById('statusText').innerText = "Kartu tidak valid atau tidak ditemukan.";
            document.querySelector('.spinner').style.display = 'none';
        } else {
            // Request ke Google Apps Script dengan action=redirect
            window.location.href = `${SCRIPT_URL}?action=redirect&card=${cardId}`;
        }
    </script>
</body>
</html>
