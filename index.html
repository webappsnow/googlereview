<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Review Card</title>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynchA-hJl-MAWgrYnzNEUvDsrkJfohWPwILtVVMWn7BrJuUOdbpOOzLOs21zAQxm90zw/exec";
        
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('card');

        if (cardId) {
            // Ambil link dari GAS
            fetch(`${SCRIPT_URL}?action=redirect&card=${cardId}`)
                .then(res => res.json())
                .then(data => {
                    let targetUrl = data.reviewLink; 
                    
                    // Pastikan link memiliki parameter untuk buka aplikasi (format intent)
                    // Jika link adalah g.page atau maps.app.goo.gl, tambahkan /review
                    if (!targetUrl.includes('/review')) {
                        targetUrl = targetUrl.replace(/\/$/, "") + '/review';
                    }

                    // Perintah "Intent" untuk memaksa buka aplikasi Maps di Android
                    // formatnya: intent://[linknya]#Intent;scheme=https;package=com.google.android.apps.maps;end
                    let intentUrl = "intent://" + targetUrl.replace("https://", "") + "#Intent;scheme=https;package=com.google.android.apps.maps;end";
                    
                    // Eksekusi paksa buka aplikasi
                    window.location.href = intentUrl;

                    // Fallback: Jika gagal buka aplikasi, tetap buka via web
                    setTimeout(() => {
                        window.location.replace(targetUrl);
                    }, 500);
                });
        }
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h3>Membuka Aplikasi Maps...</h3>
        <p>Jika aplikasi tidak terbuka, silakan klik link berikut:</p>
        <a id="fallbackLink" href="#">Lanjutkan ke Ulasan</a>
    </div>
</body>
</html>
